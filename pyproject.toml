[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailmind-ai"
version = "0.1.0"
description = "RetailMind AI — Capstone Track B Week 5 Single-Agent CSV Sales Analysis System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RetailMind AI Team" }
]
dependencies = [
    "google-genai>=2.0.0",
    "mcp>=2.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.35.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"
